[Server]
# The address to listen on. Leave blank to listen on any. If you don't know what you're doing, leave this blank.
addr = ""

# The port to listen for connections on.
port = 27016

# The hostname or IP address to advertise to the master server.
# If left blank, the master server will use the IP address from which the advertisement request is received.
# Set this to your public hostname (e.g., "hatsune.miku.pizza") or IP address if the detected IP is not correct
# (e.g., when behind NAT, using port forwarding, or when the server should be accessed via a specific domain).
advertise_hostname = ""

# Whether to listen for websocket (WebAO) connections.
enable_webao = false

# The port to listen for websocket (WebAO) connections on.
webao_port = 27017

# Whether to listen for secure websocket (WebAO over WSS) connections.
enable_webao_secure = false

# The port to listen for secure websocket (WebAO over WSS) connections on.
# Typically port 443 when using Cloudflare or other reverse proxies.
webao_secure_port = 443

# Path to TLS certificate file (optional - leave empty if using a reverse proxy like Cloudflare).
# When both tls_cert_path and tls_key_path are provided, the server will handle TLS directly.
# When empty, the server listens on plain HTTP and expects a reverse proxy to handle TLS termination.
tls_cert_path = ""

# Path to TLS private key file (optional - leave empty if using a reverse proxy like Cloudflare).
tls_key_path = ""

# Set to true if running behind a reverse proxy (nginx, Apache, etc.)
# When enabled, the master server will advertise the external ports instead of internal listening ports
reverse_proxy_mode = false

# External HTTP port exposed by reverse proxy (only used when reverse_proxy_mode = true)
# This is the port clients connect to, not the internal listening port
reverse_proxy_http_port = 80

# External HTTPS port exposed by reverse proxy (only used when reverse_proxy_mode = true)
# This is the port clients connect to, not the internal listening port
reverse_proxy_https_port = 443

# Example nginx configuration for reverse proxy setup:
# When using reverse_proxy_mode, configure Athena to listen on an internal port (e.g., 3141)
# and nginx to forward from external ports (80/443) to that internal port.
# 
# IMPORTANT: Both webao_port and webao_secure_port should be set to the SAME internal port (3141)
# because nginx handles the external port routing (80 and 443) and forwards both to this single
# internal port. Athena doesn't need separate ports since nginx performs the port demultiplexing.
#
# server {
#     listen 80;
#     server_name hatsune.miku.pizza;
#     
#     location / {
#         proxy_pass http://localhost:3141;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "Upgrade";
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# server {
#     listen 443 ssl;
#     server_name hatsune.miku.pizza;
#     
#     ssl_certificate /path/to/cert.pem;
#     ssl_certificate_key /path/to/key.pem;
#     
#     location / {
#         proxy_pass http://localhost:3141;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "Upgrade";
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# With this setup, set:
#   enable_webao = true
#   webao_port = 3141                    # Internal port - where Athena actually listens
#   enable_webao_secure = true
#   webao_secure_port = 3141             # Same internal port - nginx routes both 80 and 443 here
#   tls_cert_path = ""                   # Empty - nginx handles TLS termination
#   tls_key_path = ""                    # Empty - nginx handles TLS termination
#   reverse_proxy_mode = true            # Enable reverse proxy mode
#   reverse_proxy_http_port = 80         # External port - what clients see for HTTP
#   reverse_proxy_https_port = 443       # External port - what clients see for HTTPS
#
# The master server will then advertise:
#   ws://hatsune.miku.pizza:80
#   wss://hatsune.miku.pizza:443

# The name of your server. This is used both on the server list, and within the server.
name = "Unnamed Server"

# The description of your server.
description = "A brand new server!"

# Sets the server's message of the day (MoTD)
# This is sent to every player when they first join the server, or with /motd.
# Use triple-quoted strings (""") for a multiline MOTD — literal newlines are
# preserved and displayed as line breaks in the OOC log.
motd = """
Welcome to [Server Name]!

1. Be respectful to all players and staff.
2. No harassment, hate speech, or discrimination of any kind.
3. No NSFW content outside of designated areas.
4. No spamming IC or OOC chat.
5. Staff decisions are final.
6. Have fun!

=== Links ===
Discord: https://discord.gg/example
Website: https://example.com
"""

# The maximum amount of players who can join the server at once.
max_players = 100

# Player capacity lockdown threshold: When the number of connected players reaches this value,
# new connection attempts are rejected immediately ("server is not currently accepting new connections").
# This is a soft, runtime-adjustable cap that sits below max_players.
# Moderators can change this at any time with /setplayerlimit <n>.
# Set to 0 to disable (only the hard max_players cap applies).
player_lockdown_threshold = 0

# Lockdown purge threshold, in minutes of TOTAL accumulated playtime (not current
# session length). The instant a moderator switches lockdown ON (in-game /lockdown,
# or the Discord bot's /lockdown on), every currently-connected, non-moderator client
# whose all-time playtime on their IPID is below this is instantly kicked -- lockdown's
# new-connection block only keeps the next wave of a flood out, it does nothing about
# the flood that's already inside spamming. A player/IP with a lot of accumulated
# playtime (e.g. 500 hours) is always exempt no matter how this is set.
# Moderators can change this at any time with /setlockdownplaytime <minutes>.
# Set to 0 to disable (lockdown will only block new IPIDs, same as before).
lockdown_min_playtime = 30

# Server-private key used to derive lockdown whitelist passkeys. Each IPID has a
# unique passkey (HMAC-SHA256 of the IPID, keyed by this value) shown to them in
# the message they get when lockdown blocks them (rejected at connect, or kicked
# by the playtime purge above). It reads like "this is not a ban, give this code
# to staff", and staff runs /lockdown whitelist <passkey> to both let that IPID
# back in during lockdown AND permanently exempt it from the playtime purge from
# then on -- a self-service way to vouch for a legitimate player without staff
# needing to know their IPID or them needing to still be connected.
#
# Treat this exactly like a password: anyone who has it can mint a valid
# passkey for ANY IPID, including ones that were never actually blocked. Leave
# blank to disable the whole passkey system -- the blocked-message text and
# /lockdown whitelist <passkey> both go inert (/lockdown add and /lockdown
# whitelist all are unaffected). Changing this invalidates every
# previously-issued passkey.
secretseed = ""

# Message template shown to a player blocked by lockdown, explaining that it's
# not a ban. The literal text "{id}" is replaced with their passkey; if you
# leave "{id}" out, the passkey is appended to the end instead. Only used when
# secretseed is set above.
lockdownstring = "This is not a ban. The server is temporarily in lockdown -- give this code to staff to be let in: {id}"

# The maximum amount of bytes that players can send in a message. Long messages can slow down clients, 
# so don't make this too large.
max_message_length = 256

# Sets the detault length of bans.
# This must be a number followed by a unit. Example: "3w" - three weeks.
# Valid units are "s" (second), "m" (minute), "h" (hour), "d" (day), "w" (week).
default_ban_duration = "3d"

# Sets the number of client connections that can be made from the same IP, also known as "multiclienting".
# Set to 0 to disable multiclient limiting.
multiclient_limit = 16

# Sets the URL for the server's WebAO assets.
# If this is blank, vanilla assets will be used.
# The URL should include the protocol (e.g., "https://example.com/assets").
asset_url = ""

# --- /play <youtube-link> integration (optional, disabled by default) ---
#
# When youtube_play_prefix is non-empty AND starts with "http", users with the
# DJ permission can pass a YouTube URL to /play. Supported URL forms:
#   - https://www.youtube.com/watch?v=<id>
#   - https://youtu.be/<id>
#   - https://www.youtube.com/shorts/<id>
#   - https://music.youtube.com/watch?v=<id>
#
# The token {ASSET_URL} expands to whatever asset_url is set to above. Example:
#   youtube_play_prefix = "{ASSET_URL}/yt/"
#
# Flow:
#   1. If <destination>/<videoID>.opus (preferred) or <videoID>.mp3 already
#      exists, the area plays the URL <youtube_play_prefix><videoID>.<ext>
#      immediately.
#   2. Otherwise yt-dlp probes the video length; if it exceeds
#      youtube_max_duration_seconds the request is rejected.
#   3. yt-dlp extracts the audio as Opus (.opus) into the destination
#      directory; once the file lands, the area is told to play it
#      automatically. Opus is YouTube's native audio codec so the extraction
#      is fast and lossless (no transcoding); .mp3 is only kept as a
#      backward-compatible fallback for older caches.
#
# Leave blank to keep the feature off. yt-dlp must be on PATH when enabled.
youtube_play_prefix = ""

# Where downloaded mp3s land. Only file:// (local filesystem) is supported at
# the moment, e.g. "file:///var/lib/athena/yt". The directory must exist.
youtube_download_destination = ""

# Reject videos longer than this many seconds. Defaults to 600 (10 minutes).
youtube_max_duration_seconds = 600

# Optional path to a Netscape-format cookies.txt for yt-dlp. When set, it is
# passed as `--cookies <path>` to both the duration probe and the download.
# Use this to bypass YouTube's bot-detection wall by presenting a logged-in
# session. Generate with a browser extension like "Get cookies.txt LOCALLY".
# Leave blank to skip the flag entirely.
youtube_cookies_path = ""

# Sets the URL for the server's Discord webhook.
# If this is blank, the discord webhook will be disabled.
# To setup the webhook, follow the instructions here (https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks)
# and set this to the URL of your webhook.
webhook_url = ""

# Sets the Discord role ID to ping via the webhook when a modcall is received.
# Right-click the role in Server Settings > Roles and select "Copy Role ID" (requires Developer Mode).
# If this is blank, no role will be pinged.
webhook_ping_role_id = ""

# Sets the URL for the punishment (ban/kick) Discord webhook.
# If set, a detailed embed will be posted to this webhook channel whenever a moderator
# bans or kicks a player. The embed includes: IC name, OOC name, IPID, Ban ID (bans only),
# duration (bans only), reason, and the moderator who issued the punishment.
# Leave blank to disable punishment webhook logging.
punishment_webhook_url = ""

# Sets the maximum number of dice that can be rolled at once.
max_dice = 100

# Sets the maximum number of sides a rolled dice can have.
max_side = 100

# Sets the maximum number of statements a recorded testimony can contain.
max_testimony = 10

# Rate limiting: Maximum number of messages (IC, OOC, music) a player can send within the time window.
# Players who exceed this limit will be automatically kicked from the server.
# This helps prevent spam and resource exhaustion. Set to 0 to disable rate limiting.
# Default: 20 messages
message_rate_limit = 20

# Rate limiting: Time window in seconds for counting messages.
# For example, with message_rate_limit=20 and message_rate_limit_window=10,
# players can send up to 20 messages every 10 seconds.
# Default: 10 seconds
message_rate_limit_window = 10

# Whether to automatically ban an IPID that gets kicked for exceeding a message-based
# rate limit (message_rate_limit or ooc_rate_limit) repeatedly in a short span -- e.g. a
# bot that reconnects and immediately spams again right after being kicked. This is
# separate from packet_flood_autoban/conn_flood_autoban, which cover raw packet floods
# and connection floods respectively; this one covers ordinary IC/OOC/music spam kicks.
# Set to false to disable. Default: true
rate_limit_kick_autoban = true

# Base number of message-rate-limit kicks (within rate_limit_kick_autoban_window) before
# an IPID is automatically banned -- this is the AGGRESSIVE tier, applied to a brand-new
# connection with little to no playtime (below rate_limit_kick_autoban_lenient_playtime).
# For example, with the default value of 2, a fresh connection that gets kicked for
# spamming twice in a row is banned on the second kick. See the playtime tiers below for
# how established players get more slack instead of this base value.
# Only takes effect when rate_limit_kick_autoban = true.
# Default: 2
rate_limit_kick_autoban_threshold = 2

# Rolling window in seconds used to count rate-limit kicks toward a threshold (base or
# lenient). A kick that arrives more than this many seconds after the previous one starts
# a fresh count instead of adding to the old one, so the autoban targets a spam spree
# rather than accumulating kicks earned far apart over a player's whole time on the server.
# Default: 600 (10 minutes)
rate_limit_kick_autoban_window = 600

# How long the automatic ban from rate_limit_kick_autoban lasts. Accepts any duration
# string (e.g. "15m", "1h").
# Default: 15m
rate_limit_kick_autoban_duration = "15m"

# --- Playtime leniency tiers for rate_limit_kick_autoban ---
#
# The autoban is meant to be aggressive against fresh connections that are purely there
# to spam, but lenient toward a real player who trips the rate limit from a bad
# connection rather than actually spamming. It reads each IPID's accumulated ALL-TIME
# playtime (the same figure /playtime and the Lockdown Playtime Purge use) and applies
# one of three tiers:
#   - below rate_limit_kick_autoban_lenient_playtime: AGGRESSIVE -- the base
#     rate_limit_kick_autoban_threshold above applies (default 2 kicks).
#   - at or above rate_limit_kick_autoban_lenient_playtime, but below
#     rate_limit_kick_autoban_min_playtime: LENIENT -- needs
#     rate_limit_kick_autoban_lenient_threshold kicks instead (default 5). Not immune,
#     just harder to trip by accident than a brand-new connection.
#   - at or above rate_limit_kick_autoban_min_playtime: FULLY EXEMPT -- never auto-banned
#     by this mechanism, no matter how many times it trips the rate limit. Still gets the
#     ordinary kick every time, same as a single violation.
# Moderators are always fully exempt regardless of playtime. A DB error while checking
# playtime fails open (never bans a real player on a hiccup).

# Minutes of accumulated playtime for the LENIENT tier to kick in.
# Default: 120 (2 hours)
rate_limit_kick_autoban_lenient_playtime = 120

# Number of rate-limit kicks needed to trigger the autoban at the lenient tier. Clamped
# up to at least rate_limit_kick_autoban_threshold, so a misconfigured value here can
# never make this tier *more* aggressive than the base one.
# Default: 5
rate_limit_kick_autoban_lenient_threshold = 5

# Minutes of accumulated playtime for FULL exemption -- an established regular, never
# auto-banned by this mechanism. Mirrors lockdown_min_playtime's exact rationale. Set to
# 0 (along with rate_limit_kick_autoban_lenient_playtime = 0) to disable the playtime
# tiers entirely and apply the base threshold flatly to everyone.
# Default: 1200 (20 hours)
rate_limit_kick_autoban_min_playtime = 1200

# ─────────────────────────────────────────────────────────────────────────────
# Raid Guard (behavioural raid detection)
# ─────────────────────────────────────────────────────────────────────────────
# Every rate limit above is keyed on one identity -- an IPID, a connection --
# which is structurally blind to what a raid actually looks like: dozens of
# distinct IPIDs arriving at once, each one individually staying under any
# per-IPID limit. Raid guard instead scores BEHAVIOUR: how a connection
# handshakes, how fast it picks a character and starts talking, whether its
# OOC name or showname keeps changing message to message, whether its
# objection shouts never let up -- plus, server-wide, whether the same text is
# arriving from many different IPIDs at once and whether new IPIDs are
# bursting in. See internal/athena/raidguard.go and raidguard_corr.go for the
# full design rationale and the exact weight given to each signal.
#
# OFF BY DEFAULT (raid_guard_enabled = false below). With it off, every hot
# IC/OOC/handshake path costs exactly one atomic-bool load and nothing else is
# evaluated, allocated, or tracked. It is still a detector making automatic
# judgement calls about real connections, so read through every setting below
# -- especially raid_guard_max_action -- before turning it on.
#
# No single signal, and no accumulation of signals from ONE connection acting
# alone, can ever produce a ban. A ban additionally requires that connection's
# own text be corroborated by several OTHER IPIDs saying the same thing while
# the server is concurrently seeing raid-shaped traffic -- something a lone
# player, however oddly they behave, cannot manufacture. raid_guard_max_action
# defaults to "captcha", not "ban": banning is an explicit, separate opt-in
# (see that setting below) even after every other setting here is tuned.
#
# Moderators are never observed or scored by any of this, at any tier, for
# any signal.
#
# Every action raid guard takes sends a "[RAIDGUARD]" OOC alert to every
# moderator holding MOD_CHAT, naming the signals that fired, so a false
# positive is visible immediately and can be reversed with
# "/raidguard clear <uid>" (or "/raidguard clear all"). "/raidguard status"
# reports the live configuration plus every connection currently carrying a
# nonzero score; "/raidguard test <text>" previews what the correlation layer
# would make of a line of text without recording anything.

# Master switch for the whole feature.
# Default: false
raid_guard_enabled = false

# The STRONGEST action an operator has opted into -- raid guard will never do
# more than this, no matter how high a connection's score climbs. A verdict
# above this ceiling is clamped down to it (e.g. a would-be kick becomes a
# captcha challenge instead); everything at or below the ceiling still applies
# normally. Accepted values, weakest to strongest:
#   "watch"    -- alert staff only; never restricts the connection.
#   "captcha"  -- (default) force a fresh join-captcha question onto the
#                 connection, exactly like an unverified new IPID gets, even
#                 if it would otherwise have been exempt from one. A real
#                 player clears themselves just by answering it.
#   "silence"  -- quarantine the connection: its own IC/OOC still looks sent
#                 on its own screen but reaches nobody else, using the same
#                 restricted-delivery path the join captcha's "mute" action
#                 uses. Any pending captcha challenge is left in place so the
#                 connection can still free itself by answering it.
#   "kick"     -- disconnect the connection outright (not banned; free to
#                 reconnect).
#   "ban"      -- autoban the IPID for raid_guard_ban_duration. THIS IS AN
#                 OPT-IN, separate from every threshold below: even at this
#                 ceiling, a ban additionally requires the cross-IPID
#                 corroboration described above, so raising the ceiling to
#                 "ban" does not by itself make single-connection behaviour
#                 bannable -- it only allows the ban outcome to be reached
#                 once that stronger evidence exists.
# Default: "captcha"
raid_guard_max_action = "captcha"

# How long a raid_guard_max_action = "ban" autoban lasts. Accepts any duration
# string (e.g. "30m", "1h"). Recorded and lifted exactly like a moderator-
# issued ban -- /getban and /unban both work on it.
# Default: "30m"
raid_guard_ban_duration = "30m"

# --- Playtime tiers ---
#
# Raid guard reads each IPID's accumulated ALL-TIME playtime -- the same
# KNOWN_IPS.PLAYTIME figure /playtime, the Lockdown Playtime Purge, the join
# captcha and the repeat-offender autoban above all already use -- and scales
# every score threshold below by it, in BOTH directions: a brand-new
# connection (what a raid is actually made of) is judged MORE strictly than
# baseline, and an established player is judged MORE leniently. Four tiers,
# checked in this order:
#   - moderator, or raid_guard_min_playtime minutes and up: EXEMPT.
#     Never acted on, no matter how the connection behaves. Staff still get
#     the alert, so a compromised regular's account is visible without the
#     server automatically doing anything to it.
#   - raid_guard_lenient_playtime minutes and up: LENIENT.
#     Thresholds scaled by raid_guard_lenient_scale (a percentage above 100).
#   - raid_guard_strict_playtime minutes and up: BASELINE.
#     Thresholds exactly as configured below.
#   - under raid_guard_strict_playtime minutes (including a brand-new
#     connection with zero playtime): STRICT.
#     Thresholds scaled by raid_guard_strict_scale (a percentage below 100) --
#     this is the tier a raid actually arrives in.
# A DB error while reading playtime is treated as "not punishable" (fails
# OPEN) -- the opposite of the join captcha's fail-closed rule, and
# deliberately so: a query hiccup here must never be able to ban a real
# player.

# Minutes of accumulated playtime at/above which an IPID is FULLY EXEMPT.
# Moderators are always exempt regardless of this value. Set to 0 to disable
# this tier by playtime (moderators are still always exempt).
# Default: 1200 (20 hours)
raid_guard_min_playtime = 1200

# Minutes of accumulated playtime at/above which the LENIENT tier applies.
# Default: 120 (2 hours)
raid_guard_lenient_playtime = 120

# Threshold scale for the lenient tier, as a PERCENTAGE. 200 means every score
# threshold below is doubled, i.e. an established player needs twice the
# evidence a brand-new connection does before the same action fires. Keep
# this above 100 -- at or below it, this tier would stop being more lenient
# than baseline.
# Default: 200 (needs 2x the evidence)
raid_guard_lenient_scale = 200

# Minutes of accumulated playtime BELOW which the STRICT tier applies. A
# brand-new connection with zero playtime is always judged at this tier --
# it is the tier a raid actually arrives in, since a raid is made of
# connections with no history at all.
# Default: 15 minutes
raid_guard_strict_playtime = 15

# Threshold scale for the strict tier, as a PERCENTAGE. 70 means every score
# threshold below needs only 70% of the configured value to fire, i.e. 30%
# less evidence than baseline. Keep this below 100 -- at or above it, this
# tier would stop being stricter than baseline.
# Default: 70 (needs 30% less evidence)
raid_guard_strict_scale = 70

# Raid mode: how thresholds scale WHILE the server is under coordinated attack,
# as a percentage multiplied over the playtime tier above. 100 disables it.
#
# This closes a latency floor rather than a detection gap. Scoring a connection
# needs a message to score, so a raider's FIRST message reaches the room before
# anything is known about them -- and across a fan-out that first message, times
# the number of connections, is most of what actually gets through. The guard
# was already acting on essentially every raiding connection; it was just acting
# one or two messages in.
#
# Server-wide evidence (arrival bursts, cross-IPID correlation) shows up within
# a fraction of a second of a fan-out starting, long before any single
# connection's own score does. So once the server KNOWS a raid is happening,
# each connection needs proportionally less of its own evidence -- verdicts that
# would have landed on message two land on message one, and because the guard
# scores before delivery, that message is suppressed instead of sent.
#
# Safe to be aggressive here for three reasons. It never creates evidence, it
# only lowers the bar for evidence a connection already produced, so anyone with
# a score of zero -- which is every ordinary player who is simply talking -- is
# untouchable at any setting. It requires the under-attack state, which needs
# correlation or an arrival burst and is not reachable by one person acting
# alone, so a quiet evening never enters this mode at all. And it is
# multiplicative over the playtime tier, so an established player still needs
# proportionally more evidence than a brand-new connection.
#
# Lapses on its own two minutes after the last piece of raid evidence.
# Default: 70
raid_guard_under_attack_scale = 70

# --- Score thresholds ---
#
# Raid guard accumulates a score for one connection out of independent
# behavioural signals (see raidSignalWeight in raidguard.go for the full list
# and the exact weight given to each one), and compares that score -- scaled
# by the playtime tier above -- against the five thresholds below to decide
# the strongest action so far justified. The engine only ever escalates
# (never downgrades) a connection it has already acted on, and every verdict
# is still clamped by both raid_guard_max_action and the playtime-exemption
# tier before anything actually happens to the connection. No single signal,
# and no pair of signals, reaches the ban threshold on its own -- reaching it
# requires several independent things to be true about the same connection at
# once.

# Score at which raid guard sends staff an alert but takes no action on the
# connection itself.
# Default: 40
raid_guard_score_watch = 40

# Score at which raid guard forces a fresh join-captcha challenge onto the
# connection (subject to raid_guard_max_action).
# Default: 60
raid_guard_score_challenge = 60

# Score at which raid guard quarantines the connection -- its own messages
# look sent on its own screen but reach nobody else (subject to
# raid_guard_max_action).
# Default: 80
raid_guard_score_silence = 80

# Score at which raid guard disconnects the connection outright, without a
# ban (subject to raid_guard_max_action).
# Default: 100
raid_guard_score_kick = 100

# Score at which raid guard would autoban the IPID -- gated behind BOTH
# raid_guard_max_action = "ban" AND the cross-IPID corroboration described
# above. Short of either one, this ceiling instead applies whatever the next
# strongest allowed action is.
# Default: 160
raid_guard_score_ban = 160

# --- Individual signal tuning ---
#
# These tune exactly when specific behavioural signals fire. Every signal
# fires AT MOST ONCE per connection (so repeating one behaviour can't inflate
# a score without bound), and every one is individually weighted well below
# the thresholds above -- reaching an action always takes several different
# signals together, never one repeated.

# Minimum number of IC messages a connection must have sent before the
# sustained-objection-shout signal is even considered. Guards against one
# dramatic "Objection!" entrance -- the whole point of AO2 -- tripping it.
# Default: 3
raid_guard_objection_min_msgs = 3

# Fraction (0.0-1.0) of a connection's IC messages that must be objection
# shouts for the sustained-objection signal to fire. A real trial interleaves
# dialogue with shouts and never approaches this; a raider spamming nothing
# but "OBJECTION" on every message does.
# Default: 0.8 (80% of messages)
raid_guard_objection_fraction = 0.8

# Milliseconds after a connection is ACCEPTED (not after its handshake
# completes -- the whole handshake window counts) within which picking a
# character is considered implausibly fast for a human reading a character
# list.
#
# Bounded by protocol physics, not by taste: a real client cannot pick a
# character before it has received the character list, because it builds the
# picker from that list. The fastest full handshake in the clean capture was
# 330ms, so nothing under that is reachable by a legitimate pick -- including a
# client auto-picking from a share link. 1000 is the obvious-looking value and
# is WRONG: 6 of the 19 real handshakes in that capture completed inside it, so
# a fast connection auto-picking a character would have tripped this signal.
# Default: 250
raid_guard_fast_charpick_ms = 250

# Milliseconds after a connection's FIRST character pick within which sending
# its first IC message is considered implausibly fast. The weakest timing
# signal on purpose -- a returning player with a saved character can
# legitimately be this quick, so on its own it only ever nudges a score, never
# decides one.
# Default: 1500
raid_guard_fast_speech_ms = 1500

# Milliseconds between consecutive character picks (CC packets) within which
# re-rolling characters is considered faster than a person could plausibly be
# reading the character list between picks.
# Default: 1000
raid_guard_char_churn_ms = 1000

# Number of DISTINCT OOC names, or distinct shownames, a single connection can
# use before the name-churn signal fires. Counts distinct VALUES seen, not how
# often the field appears on the wire (a real client resends its current name
# on every single packet).
# Default: 3
raid_guard_name_churn_max = 3

# --- Cross-IPID content correlation (layer 2) ---
#
# Separate from the per-connection signals above: this tracks whether the
# SAME text is arriving from several DIFFERENT IPIDs within a short window --
# exactly the fan-out shape a raid produces, and something no per-IPID rate
# limit can ever see. Matching is by overlapping token "shingle", not exact
# text equality, so a raider varying a line slightly between sends
# (prepending "/g ", appending another slur) still correlates against their
# earlier messages. This layer is also the ONLY thing that can ever make a
# ban reachable -- see raid_guard_max_action above.

# Seconds a piece of text is tracked for cross-IPID correlation before it
# ages out of the window.
#
# Measured from when the text was FIRST seen, not when it was last repeated, so
# a line's tally is always "how many people said this inside one window" and
# never accumulates indefinitely because something keeps touching it.
#
# Raised from 10 to 30 after the 2026-08-31 raid, which re-used one line at +1s
# and again at +19s, and a second line 16s after its first use. A 10-second
# window saw one of those three repeats; 30 sees all three. Costs nothing on
# clean traffic: replaying both clean captures in internal/athena/testdata at
# 10s, 30s and 60s produces zero cross-IPID correlations at every setting.
# Default: 30
raid_guard_corr_window = 30

# Number of DISTINCT IPIDs that must say the same (or near-identical, via
# shingling) text within raid_guard_corr_window seconds before it counts as
# coordinated. This is the STRONG level: it is worth 45 points, it flips the
# server-wide "under attack" state, and it is the only thing that can ever
# satisfy the ban gate.
# Default: 4
raid_guard_corr_ipids = 4

# The WEAK level: how many distinct IPIDs saying the same text counts as an
# echo worth scoring at all. Worth 25 points -- below the watch threshold at
# every playtime tier, so on its own it neither alerts nor acts; it takes a
# second, independent signal before anything happens to anyone. It never
# satisfies the ban gate, so two players quoting each other cannot arm a ban
# between them however long they keep it up.
#
# This exists because a single threshold of 4 answered the wrong question for
# anything but the loudest possible raid. The 2026-08-31 raid put ten IPIDs and
# ten different slurs on the server over twenty-six seconds, re-using lines two
# and three times but never four, so layer 2 contributed nothing at all to it --
# no signal, no under-attack flag, no ban ever reachable. At 2 the same capture
# is corroborated on its fourth message, seven seconds in.
#
# Clamped to at least 2 (one IPID saying its own line corroborates nothing) and
# to at most raid_guard_corr_ipids.
# Default: 2
raid_guard_corr_ipids_weak = 2

# How many DISTINCT lines must be echoing across IPIDs at the same time before
# the server counts as under attack on breadth alone.
#
# Depth and breadth are different claims. Two friends quoting each other are one
# line echoed by two people however many times they do it -- breadth 1, and
# ordinary. A raid is several different lines each echoed by different people at
# once, which no pair of players can produce between them. Measured across the
# captures in internal/athena/testdata: breadth peaked at 0 on both clean
# captures and at 11 during the raid capture.
# Default: 3
raid_guard_corr_breadth = 3

# Minimum normalized-character length a message must reach before it is even
# considered for correlation at all. Short lines (two players independently
# typing "/gas", say) are extremely common and are NOT evidence of
# coordination -- this floor exists specifically to exclude them (measured at
# 57% of a clean baseline capture before the floor was added).
# Default: 15
raid_guard_corr_min_len = 15

# Hard cap on the number of distinct text fingerprints the correlation window
# tracks at once. Bounds memory use under an actual raid -- which is exactly
# the traffic that feeds this structure -- by clearing the window wholesale
# rather than growing it further once this many entries are held. Losing
# detection state under extreme load is acceptable; running the server out of
# memory is not.
# Default: 4096
raid_guard_corr_max_entries = 4096

# Number of distinct NEW IPIDs arriving within one second that counts as an
# arrival burst -- the "many strangers show up at once" half of the raid
# shape, tracked independently of the content correlation above.
# Default: 12
raid_guard_arrival_burst = 12

# Automatically engage the server lockdown (see "Lockdown Playtime Purge"
# above) the moment the raid guard's server-wide "under attack" state trips, so
# a fan-out stops growing while staff are still reading the alert. New IPIDs
# cannot join until a moderator runs /lockdown off.
#
# This deliberately does NOT run the playtime purge that /lockdown on performs.
# The purge disconnects every connected player under the playtime threshold,
# which during a raid includes any genuine newcomer who happened to join that
# evening. The join gate alone costs a real player a delayed connection; the
# purge costs them their session, and automatic detection is not confident
# enough to spend that on its own. A moderator who wants the purge runs
# /lockdown on themselves -- staff are told exactly that in the alert.
#
# Off by default: this is the guard's only server-wide action, and it affects
# players who have done nothing at all beyond trying to connect at a bad moment.
# Default: false
raid_guard_auto_lockdown = false

# Modcall cooldown: Minimum number of seconds a user must wait between modcalls.
# Set to 0 to disable the cooldown (allow unlimited modcalls).
# Example: setting this to 60 means a user can only send one modcall per 60 seconds.
# Default: 0 (disabled)
modcall_cooldown = 0

# Connection rate limiting: Maximum number of new connections an IP can make within the
# connection rate limit window. Connections that exceed this limit are immediately rejected
# before the WebSocket handshake, preventing floods from crashing the server.
# Set to 0 to disable connection rate limiting.
# Default: 10 connections
connection_rate_limit = 10

# Connection rate limiting: Time window in seconds for counting new connections per IP.
# For example, with connection_rate_limit=10 and connection_rate_limit_window=10,
# an IP may open at most 10 new connections every 10 seconds.
# Default: 10 seconds
connection_rate_limit_window = 10

# Whether to automatically ban IPs that are repeatedly rejected by the connection rate limit.
# When an IP has its connection rejected more than conn_flood_autoban_threshold times
# (within the same connection-rate window), it is banned for default_ban_duration.
# This stops endless reconnection floods from wasting server resources.
# Set to false to disable. Default: true
conn_flood_autoban = true

# Number of connection rejections (due to the connection rate limit) before an IP is
# automatically banned. For example, with the default value of 6, an IP that has its
# connection rejected 6 or more times will be auto-banned.
# Only takes effect when conn_flood_autoban = true.
# Default: 6
conn_flood_autoban_threshold = 6

# Whether to automatically ban IPs that exceed the raw packet rate limit.
# Raw packet flooding (sending hundreds of packets per second) is a clear bot/DDoS
# indicator. When enabled, such IPs are banned for default_ban_duration.
# For connection-level flood banning see conn_flood_autoban above.
# Default: true
packet_flood_autoban = true

# Raw packet rate limiting: Maximum number of AO2 protocol packets (of any type) a single
# client connection may send within the raw packet rate limit window.
# Unlike message_rate_limit (which only counts IC/OOC/music packets), this counts EVERY
# incoming packet — MS, CC, CH, PU, HP, RT, unknown headers, etc.
#
# Tuning rationale:
#   Legitimate AO2 client maximum — join handshake (HI+ID+askchaa+RC+RM+RD = 6 packets,
#   each gated by a server reply) plus simultaneous gameplay actions is at most ~12 packets
#   in any 2-second window under the most frantic normal use.
#   Bot/flooder minimum to be meaningful is 30+ packets per second.
#   The default of 20 per 2 seconds (10/s average) sits safely between those two extremes:
#   no legitimate player will ever reach it; any flooding bot is caught within 2 seconds.
#
# Set to 0 to disable raw packet rate limiting.
# Default: 20 packets
raw_packet_rate_limit = 20

# Raw packet rate limiting: Time window in seconds for counting all incoming packets.
# Decimal values are supported, e.g. 0.05 means a 50-millisecond window.
# For example, with raw_packet_rate_limit=10 and raw_packet_rate_limit_window=0.05,
# a connection that sends more than 10 packets in 50ms is banned.
# Default: 2 seconds
raw_packet_rate_limit_window = 2

# OOC rate limiting: Maximum number of OOC messages a player can send within the OOC rate limit window.
# OOC packets that exceed this limit are silently dropped, preventing OOC flooding.
# Set to 0 to disable OOC rate limiting.
# Default: 4 messages
ooc_rate_limit = 4

# OOC rate limiting: Time window in seconds for counting OOC messages.
# For example, with ooc_rate_limit=4 and ooc_rate_limit_window=1,
# players can send at most 4 OOC messages per second.
# Default: 1 second
ooc_rate_limit_window = 1

# Ping rate limiting: Maximum number of ping (CH) packets an IP can send within the ping rate limit window.
# Ping packets that exceed this limit are silently dropped, preventing ping flooding even from new connections.
# Set to 0 to disable ping rate limiting.
# Default: 10 pings
ping_rate_limit = 10

# Ping rate limiting: Time window in seconds for counting ping packets.
# For example, with ping_rate_limit=10 and ping_rate_limit_window=5,
# an IP may send at most 10 pings every 5 seconds.
# Default: 5 seconds
ping_rate_limit_window = 5

# CH idle timeout: If a joined client does not send a CH (ping/heartbeat) packet within
# this many seconds, they are forcibly disconnected.
# AO2 clients typically send a CH packet every 10 seconds, so a value of 60 (6 missed pings)
# is a safe default that weeds out stale connections without affecting legitimate players.
# Set to 0 to disable (connections are never timed out for missing pings).
ping_timeout = 0

# New IPID OOC cooldown: Number of seconds a brand-new IPID (one that has never connected
# to this server session before) must wait before being allowed to send OOC chat messages.
# Commands (starting with /) are exempt from this cooldown.
# Set to 0 to disable. Default: 10 seconds.
new_ipid_ooc_cooldown = 10

# New IPID IC cooldown: Number of seconds a brand-new IPID must wait before being allowed
# to speak in-character. Unlike the OOC cooldown, this check runs AFTER the message rate
# limit and AutoMod/censor checks in pktIC (not before) -- so a flood or slur burst from a
# fresh connection during the cooldown window still gets judged, and can still be
# kicked/banned, by those checks instead of being silently shielded by the cooldown. The
# cooldown itself only ever rejects an otherwise-clean message sent too early.
# Set to 0 to disable. Default: 10 seconds.
new_ipid_ic_cooldown = 10

# New IPID modcall cooldown: Number of seconds a brand-new IPID must wait before being
# allowed to send a modcall. This prevents throwaway connections from flooding moderators.
# Set to 0 to disable. Default: 60 seconds.
new_ipid_modcall_cooldown = 60

# Global new-IP rate limit: Maximum number of distinct new IPs (IPIDs that have never
# connected to this server session before) that can be accepted within the time window below.
# When this limit is reached, connections from additional unknown IPs are immediately closed
# until the window clears, protecting the server against floods using many unique source IPs.
# IPs that have already connected at least once (returning players) are NEVER affected by
# this limit. Set to 0 to disable. Default: 5 unique IPs.
global_new_ip_rate_limit = 5

# Global new-IP rate limit: Time window in seconds for counting new unique IPs.
# For example, with global_new_ip_rate_limit=5 and global_new_ip_rate_limit_window=10,
# the server accepts at most 5 brand-new IP addresses per 10 seconds.
# A short window (10 s) catches fast bot bursts (dozens of unique IPs in milliseconds)
# while still allowing a sustained rate of 30 new players per minute — far above any
# legitimate server's intake rate. Returning players are unaffected.
# Default: 10 seconds.
global_new_ip_rate_limit_window = 10

# IP database retention: Number of days after which an IP that has not reconnected
# is removed from the known-IP database. Removing stale IPs keeps the database lean
# and ensures long-inactive addresses are subject to new-connection cooldowns if they
# ever reconnect. IPs are also removed immediately whenever they are banned, so that
# a re-connecting player whose ban has expired is treated as a new IP again.
# Set to 0 to disable automatic pruning (IPs are kept forever).
# Default: 0 (disabled)
ip_retention_days = 0

# Sets the allowed origin hostname for WebSocket (WebAO) connections.
# Only connections whose Origin header hostname matches this value will be accepted.
# This is matched against the hostname portion of the Origin header (e.g. "web.aceattorneyonline.com"
# matches an Origin of "https://web.aceattorneyonline.com"). Glob patterns are supported.
# Set to "*" to allow connections from any origin (disables enforcement).
# Default: "web.aceattorneyonline.com"
webao_allowed_origin = "web.aceattorneyonline.com"

# AutoMod: Automatically acts on any player who sends a message (IC or OOC),
# uses a showname, or picks an OOC username that contains a word from the
# banned-word list. The word filter itself always runs once a wordlist is
# loaded (see automod_wordlist below); this toggle only gates the punitive
# action tier (automod_action) — with it off, a trip still falls back to the
# safe shadow-drop behaviour rather than doing nothing.
# Set to true to enable full enforcement. Default: false.
automod_enabled = false

# Path to the banned-words file, relative to the config directory.
# Each non-empty line is one entry; lines beginning with '#' are comments.
# An entry is just a word or phrase (case-insensitive) — that alone is fully
# backward compatible and gets automod_action below applied to it — but can
# optionally carry a severity tier and a match mode, '|'-separated:
#
#   word | tier | mode
#
# e.g. "tranny | nuke" (destroy the message and ban outright, no matter what
# automod_action says) or "rape | severe | word" (matches the whole word
# "rape" and its stem-preserving inflections, without also matching inside
# "therapeutic" the way plain substring matching would, which is why that
# entry needs "word" mode to load at all). See banned_words.txt itself for
# the full syntax reference and the complete tier/mode table.
# Default: "banned_words.txt".
automod_wordlist = "banned_words.txt"

# Action to take when the AutoMod detects a "default"-tier (i.e. untiered, or
# explicitly "| default") banned-word match. Whatever the action, every trip
# also alerts online moderators in OOC (each mod can silence the alerts for
# their session with /censoralerts off). A "severe"-tier match takes this
# same action, plus a large raid-guard score contribution; a "watch"-tier
# match is delivered normally and only alerts/scores; a "nuke"-tier match
# ignores this setting entirely — see automod_wordlist above and
# automod_nuke_ban_duration below.
# Accepted values:
#   "shadow"  — (default) Shadow-send the censored message: it is echoed back
#               to the sender so their client shows it as sent, but no other
#               client ever receives it. The speaker's IPID is also added to
#               the torment list. Clean messages are unaffected.
#               Inspect with /tormentlist; lift with /untorment <ipid|all>.
#   "ban"     — Permanently ban the player.
#   "kick"    — Kick the player from the server without a ban.
#   "mute"    — Permanently mute the player's IC and OOC chat.
#   "torment" — Drop the message and add the player's IPID to the torment
#               list. Tormented players are randomly disconnected every time
#               they connect, making the experience deeply unpleasant without
#               a hard ban. Use /untorment <ipid|all> to lift.
automod_action = "shadow"

# How long a "nuke"-tier banned-word match (see automod_wordlist above) bans
# the offending IPID for. A nuke destroys the message before anyone —
# including the sender — sees it, and bans unconditionally; this setting only
# controls the ban's length, never whether it happens.
# Accepts a duration string ("30m", "3d", "2h30m", ...) or the literal
# "permanent" for an unappealable-by-time-alone ban. An unparseable value
# falls back to permanent (with a startup warning) rather than to some
# arbitrary short ban, since a word an operator put in the nuke tier is one
# they explicitly asked to be treated as the harshest case.
# Default: "permanent".
automod_nuke_ban_duration = "permanent"

# /randomsong cooldown: Tiered minimum seconds between uses of /randomsong.
#   random_song_cooldown      — regular users (default 20)
#   random_song_cooldown_dj   — clients with the DJ permission (default 5)
#   random_song_cooldown_mod  — moderators (default 0; spam allowed)
# Set any tier to 0 to disable that tier's cooldown.
random_song_cooldown = 20
random_song_cooldown_dj = 5
random_song_cooldown_mod = 0

# /botban playtime threshold: Minimum total playtime in seconds a spectator must have
# accumulated (across all past sessions plus the current session) to be exempt from /botban.
# Spectators whose total playtime is below this value will be permanently banned by /botban.
# Raise this value to catch longer-lived bots; lower it to be more conservative.
# Default: 120 seconds (2 minutes).
botban_playtime_threshold = 120

# IPHub API key for VPN/proxy detection.
# When set, moderators can use /firewall on|off to enable or disable IP screening.
# While the firewall is active, every new IP (not previously known to the server) is
# checked against the IPHub API (https://iphub.info). If the IP is classified as a
# VPN or non-residential proxy (block=1), the connection is immediately rejected.
# IPs that are already known to the server (from previous connections) are never
# sent to the API, and each unique IP is only checked once per server session to
# respect the free-tier limit of 1 000 requests/day.
# Leave blank to disable IPHub integration entirely (the /firewall command will
# still exist but will report that no API key is configured).
iphub_api_key = ""

# ─────────────────────────────────────────────────────────────────────────────
# Translator Punishment
# ─────────────────────────────────────────────────────────────────────────────
# The /translator curse <uid> <language> punishment translates a target's IC
# messages into another language via an external translation API.  A second
# form, /translator curse <uid> random, translates each word of every message
# into an independently-chosen random language.  Use /untranslator curse <uid>
# to remove the punishment.
#
# This feature is OFF by default and requires two steps to enable:
#   1. Set enable_translator_punishment = true below.
#   2. Configure translator_api_key with a valid key for your chosen provider.
# If either step is missing, the /translator command is refused at the call
# site with a helpful message and no network requests are ever made.
#
# The default endpoint points at DeepL's free tier
# (https://api-free.deepl.com/v2/translate), which gives 500 000 characters of
# translation per month for free after signing up at https://www.deepl.com and
# creating an API key under Account → Authentication Key for DeepL API.  If
# you upgrade to DeepL API Pro, change translator_api_url to
# https://api.deepl.com/v2/translate — no other code changes required.
#
# Requests are sent as HTTP POST with an Authorization: DeepL-Auth-Key header,
# so the API key is never included in the URL or query string.  Language codes
# are DeepL's UPPERCASE ISO codes (EN-US, PT-BR, ZH, …); friendly names like
# "french" or "japanese" are mapped automatically at the command site.
# Default: false.
enable_translator_punishment = false

# URL of the translation API endpoint.  DeepL Free is the reference default;
# set this to https://api.deepl.com/v2/translate if you have a DeepL Pro key.
# Default: "https://api-free.deepl.com/v2/translate".
translator_api_url = "https://api-free.deepl.com/v2/translate"

# API key for the translation provider.  REQUIRED — the server will refuse to
# run /translator commands while this is blank, matching the "enable it THEN
# put the api key in the config" policy.  For DeepL, paste the full key
# (including any ":fx" suffix on Free keys) exactly as shown in the dashboard.
# Default: "" (disabled).
translator_api_key = ""

# Cooldown in seconds for the /translate command (available to all players).
# This is separate from the /translator punishment — /translate lets any player
# translate a snippet of text on demand.  Set to 0 to remove the cooldown.
# Moderators always bypass the cooldown regardless of this value.
# Default: 25.
translate_cooldown = 25

# ─────────────────────────────────────────────────────────────────────────────
# Casino & Player Account System
# ─────────────────────────────────────────────────────────────────────────────
# Set to true to enable the Nyathena casino mini-games (blackjack, poker, slots,
# roulette, baccarat, craps, crash, mines, keno, prize wheel) and the player
# account system (/register, /account, /chips leaderboard).
#
# When set to false:
#   • All casino game commands are disabled server-wide and respond with a
#     "not enabled on this server" message.
#   • /register, /account, /chips, /casino, /casinoenable, and /casinoset are
#     also hidden from /help and blocked.
#   • Existing moderator/admin accounts in the database are unaffected —
#     /login and /logout continue to work normally.
#   • All existing chip balances and player account data in the database are
#     preserved and will be fully accessible if you re-enable this setting later.
#
# Default: false
enable_casino = false

# Enable the lightweight player account system even when the casino is disabled.
# When true, players can still /register and use non-gambling account features:
#   • 👗 Wardrobe (/favourite, /wardrobe) — save and swap between favourite characters.
#   • 🏷️ Default cosmetic tags (/settag) — equip any tag from the /shop catalog for free
#     while the casino is off (chip costs are waived because the chip economy is disabled).
#   • ⏱️ Playtime tracking (/playtime) — accumulated hours persist across sessions.
# Unauthenticated joiners also receive an on-join welcome message that documents
# these features and the tag catalog; authenticated players who /login skip it.
# When enable_casino is true this setting has no effect (the existing casino
# welcome is used instead and accounts are always on).
# When false, account commands are disabled along with the casino.
# Default: true
enable_accounts = true

# Require players to complete a random captcha when registering a new account.
# When true, /register issues a one-time token that the player must echo back
# with /captcha <token> before the account is created. This prevents automated
# bulk registration from a single session.
# Set to false to allow immediate registration without any captcha step.
# Default: true
register_captcha = true

# ─── Join Captcha (new-IP verification) ──────────────────────────────────────
#
# Requires a previously-unseen IPID to answer one question before it can send
# IC or OOC messages, run most commands, or change the music. Everything else --
# connecting, looking around, picking a character, moving between areas -- works
# normally while unverified, so this is a speech gate, not a connection gate.
#
# It exists for raids specifically. A flood arrives from many IPIDs and HDIDs at
# once, so bans and per-IP limits are always a step behind it; what none of those
# connections can do is answer a question.
#
# The questions are built so that copying will not work: the answer is never
# printed anywhere in the question. "Type ABC123 to verify" is defeated by three
# lines of regex, so nothing here works that way -- the answer always has to be
# derived (add two numbers written as words, reverse a token, count things,
# continue a sequence, pick out non-adjacent characters). There are fifteen
# kinds, several phrasings each, and a randomised wrapper around all of them.
# Default: false
join_captcha = false

# How many failures a connection gets before join_captcha_action fires. Both a
# blocked message and a wrong answer count as one failure, so this is a total
# budget across everything the player does wrong, not three of each.
# Default: 3
join_captcha_strikes = 3

# What happens when a connection runs out of strikes.
#
#   "mute"  (default) Stop its messages reaching the room.
#   "kick"  Disconnect it with an explanation instead.
#
# Muting is the default because a kick is a loud, immediate signal and there is
# no reason to hand one out for free. Staff are alerted either way, and the
# messages are kept in the area log tagged, so a real player caught by mistake
# is visible and can be released with /joincaptcha verify <uid>.
# Default: "mute"
join_captcha_action = "mute"

# Seconds a connection has to answer before it strikes out on its own, so an
# idle bot that never replies is dealt with rather than sitting there.
# 0 disables the timeout (the gate simply stays up until they answer).
# Default: 180
join_captcha_timeout = 180

# Also show the question in a client-side popup (the AO2 BB packet) as well as
# in OOC. Desktop AO2 renders it as a message box, WebAO as a notice. Set false
# if you would rather only use the OOC copy.
# Default: true
join_captcha_popup = true

# Remember that an IPID passed, so it is never challenged again.
# Set false to challenge every connection, every time -- stricter, but a player
# whose connection drops mid-scene then has to solve another one to get back in.
# Default: true
join_captcha_remember = true

# Skip the captcha entirely for any IPID with at least this much accumulated
# all-time playtime, in minutes. Reads the same figure /playtime shows.
#
# Hours on the server is a far stronger statement about being a real person than
# any puzzle, and the captcha is there to sort brand-new connections during a
# raid -- so asking a regular anything is pure friction. Between this and
# join_captcha_remember, an established player should never see a question.
#
# 0 disables the exemption (everyone unverified is asked).
# Default: 300 (5 hours)
join_captcha_min_playtime = 300

# Which question kinds to use. Leave empty for all of them. Naming a subset lets
# you rotate the mix from config if someone ever does build a solver, which
# invalidates their work without a rebuild.
# Valid kinds: math, reverse, acronym, charpick, everyother, countletter,
#              category, sequence, nato, concat, wordlength, wordorder,
#              sumdigits, alphabet, oddposition
# Default: [] (all)
join_captcha_kinds = []

# ── Making it harder to beat from the source ──
#
# This server is open source, so the built-in questions are public. Three things
# address that, in increasing order of strength.
#
# 1. A secret key. Challenges are derived as HMAC-SHA256(key, ipid + time
#    window), so which question a given address gets is unpredictable without
#    the key and cannot be worked backwards from any number of observed
#    challenges. It also means a connection cannot reroll: reconnecting inside
#    the window returns the SAME question, so a bot whose solver only handles
#    arithmetic cannot just reconnect until it draws one.
#
#    The key comes from secretseed (further down this file), domain-separated so
#    it can't collide with the lockdown passkey MAC that shares it. Set
#    join_captcha_secret to use a separate key instead. With neither set, a
#    random key is generated at startup -- still unpredictable, it just changes
#    when the server restarts.
join_captcha_secret = ""

# How long one IPID keeps the same question, in seconds. Long enough that a
# reconnect loop cannot fish for an easier one. Set to -1 to disable keying
# entirely (every connection then draws independently, and rerolling works).
# Default: 3600
join_captcha_rotate = 3600

# 2. Your own questions. Anything you write in this file is not in the public
#    repository and cannot be derived from it. One per line:
#
#        question text | answer
#        question text | answer, alternative, another
#
#    Answers ignore case, spaces and punctuation. An entry whose answer appears
#    inside its own question is rejected at load time with a warning, since that
#    would be copy-pasteable. Hot-reloadable with /reload.
#    Leave blank for the default (config/captcha_questions.txt); a missing file
#    simply means the built-in questions are used on their own.
join_captcha_questions = "captcha_questions.txt"

# Use ONLY your own questions and never the built-in ones, so the public source
# reveals nothing about what a joining player is asked. Ignored (with the
# built-ins used anyway) if the question file is empty -- serving no captcha at
# all would quietly open the gate, which is worse than serving a known one.
# Default: false
join_captcha_custom_only = false

# 3. A plugin. Point this at your own program and the server stops generating
#    questions altogether: it asks the plugin for one, shows it, and passes
#    answers back. The plugin is a separate process speaking newline-delimited
#    JSON on stdin/stdout (see docs/CAPTCHA_PLUGIN.md), so it can be written in
#    any language, is not bound by this server's licence, and cannot crash the
#    server. If the plugin returns no answers -- only an opaque token -- then
#    the answer never exists inside the server process at all and every attempt
#    is judged by the plugin.
#
#    If the plugin is missing or down, the built-in questions are used instead,
#    on purpose: a captcha that stops working because a helper crashed would
#    open the gate during exactly the incident it exists for.
# Default: "" (no plugin)
captcha_plugin = ""

# How long to wait for a plugin reply, in milliseconds, before falling back.
# Default: 3000
captcha_plugin_timeout = 3000

# ─── Join Popup (first-time welcome message) ─────────────────────────────────
#
# Shows an operator-authored welcome message to any IPID connecting to this
# server for the very first time ever -- via the same client-side popup (the
# AO2 BB packet) the join captcha above uses, so it lands in an unmissable
# dialog on desktop AO2 and a notice on WebAO. A copy is also sent to OOC so
# it's still there after the popup is dismissed.
#
# "First time ever" is the same notion of new every new_ipid_* cooldown and
# exemption above already agrees on: never seen in the server's database, not
# merely unseen this session. A returning player is never shown it again,
# server restart or not.
#
# Independent of join_captcha: this is not a gate, nothing is blocked, and a
# genuinely new IPID can see the welcome popup, the captcha challenge, both,
# or neither depending on how each is configured.
# Default: false
join_popup = false

# The message shown. Use a triple-quoted string to list several lines -- rules,
# a Discord invite, a website, whatever new players should see first. Links
# are plain text (AO2 has no clickable-link support) but a player can select
# and copy them.
# Leave blank to disable the popup even when join_popup is true -- flipping
# the toggle on without writing anything here is a silent no-op, not an empty
# dialog.
# Default: "" (nothing shown)
join_popup_message = """
Welcome to the server! Please read the rules before playing:
https://example.com/rules

Join our Discord: https://discord.gg/your-invite-here
"""

# ─── Community Voting ────────────────────────────────────────────────────────

# Enable the community moderation vote system.
# When enabled, players can use /cvote to request moderation actions against
# other players. Once enough votes are collected (vote_threshold), moderators
# are notified and can accept or reject the vote with /cvote accept|reject.
# Moderators always have final say — no action is taken automatically.
# Default: false
enable_community_vote = false

# Number of unique player votes required to pass a community vote.
# Votes are de-duplicated by IPID so each IP address can only contribute one vote.
# Default: 3
vote_threshold = 3

# Seconds a community vote remains active before it expires.
# This timer applies both to votes collecting signatures and to passed votes
# waiting for a moderator response.
# Default: 120
vote_duration = 120

# Which moderation actions players are allowed to vote on.
# Valid values:
#   "kick"     — disconnect the player from the server
#   "mute"     — silence the player for vote_mute_duration seconds
#   "ban"      — ban the player (uses default_ban_duration)
#   "warn"     — send the player a formal warning message (no persistent effect)
#   "areakick" — move the player to the default area (soft removal)
# Keep this list conservative — bans in particular should be used carefully.
# All actions still require moderator approval via /cvote accept.
# Default: ["kick"]
vote_actions = [ "kick" ]

# Duration in seconds of a community-vote mute.
# Only relevant when "mute" is included in vote_actions.
# Default: 300 (5 minutes)
vote_mute_duration = 300

# ─── Typing Race ────────────────────────────────────────────────────────────

# Custom phrases for the /typingrace minigame.
# If left empty, the built-in phrase pool (30+ phrases) is used.
# Each phrase should be at least 4 words for a meaningful WPS reading.
# Example:
#   typing_race_phrases = [
#     "the quick brown fox jumps over the lazy dog",
#     "objection your honour the witness is lying",
#   ]
typing_race_phrases = []

# ─── Daily Newspaper ────────────────────────────────────────────────────────

# Enable the auto-generated IC newspaper that is broadcast at a fixed interval.
# Default: false
enable_newspaper = false

# How often the newspaper is broadcast.
# Accepts duration strings such as "24h", "12h", "6h".
# Default: "24h"
newspaper_interval = "24h"

# Which sections to include in each newspaper issue, in display order.
# Available sections:
#   chip_leaderboard   — Top 5 players by chip balance
#   playtime_top       — Top 5 players by playtime
#   unscramble_top     — Top 5 unscramble champions
#   recent_bans        — 5 most recent ban summaries (no IDs shown)
#   server_stats       — Current player count and area count
#   weather            — Random flavour weather forecast
#   horoscope          — Random daily horoscope sign + message
#   word_of_the_day    — Legal/courtroom vocabulary entry
#   casino             — Top 3 chip holders (casino feature only)
#   area_highlight     — Most populated area spotlight
#   job_market         — Top 3 job earners
#   punishment_report  — Count of currently punished players
#   tip_of_the_day     — Courtroom/RP tip
#   classifieds        — Humorous classified ad
#   holiday_greeting   — Random seasonal greeting
# Default (used when this list is empty):
#   server_stats, weather, horoscope, tip_of_the_day, chip_leaderboard, area_highlight
newspaper_sections = []

# ─── Goroutine Pool ─────────────────────────────────────────────────────────

# Maximum number of concurrent connection-handling goroutines.
# When the server receives more simultaneous connections than this limit, new
# connections wait for a slot rather than spawning unbounded goroutines.
#
# IMPORTANT: This MUST be a plain whole number (e.g. 200). Do NOT write "2x",
# "2×", "2*max_players", or any formula -- the server will fail to start with
# a TOML parse error.
#
# Set to 0 to disable the pool (unlimited goroutines, original behaviour).
# Otherwise, a reasonable starting point is roughly double your max_players.
# For example, if max_players = 100, set this to 200.
#
# Default: 0 (disabled)
max_connection_goroutines = 0

# ─── Operator Terminal Dashboard ────────────────────────────────────────────

# Start the read-only terminal dashboard (player count, area occupancy, recent
# log tail) at launch. Equivalent to passing the -tui CLI flag. When on, the
# stdin CLI is disabled and stdout log output is suppressed while the dashboard
# owns the screen -- log entries still go to the log file and show up in the
# dashboard's own log pane. Press Ctrl-C to stop the server as usual.
# Default: false
enable_tui = false

[Logging]
# When a user calls a mod, each area's buffer of recent actions (IC chat, OOC
# chat, judge actions, etc.) is flushed to a report file for review. That
# buffer retains a rolling 24-hour window of actions regardless of how many
# lines that is. log_buffer_size caps the number of lines kept, as a safety
# valve against unbounded memory use in an extremely active area.
# 0 = no cap -- the 24-hour window alone governs retention (recommended).
log_buffer_size = 0

# Sets the log level. Events of lower levels will not be logged.
# Valid levels: info, warning, error, fatal
log_level = "info"

# Sets the path to the log directory.
# This directory will be used for storing report files, the server audit log, and the server log.
log_directory = "logs"

# Sets which log methods to use.
# Methods: stdout, log_file
log_methods = [ "stdout" ]

# Enable per-area folder logging with daily rotation.
# When enabled, each area gets its own folder under logs/ with daily log files.
# Format: logs/AreaName/AreaName-YYYY-MM-DD.txt
# Each log line includes: [HH:MM:SS] | ACTION | CHARACTER | IPID | HDID | SHOWNAME | OOC_NAME | MESSAGE
enable_area_logging = false

# Enable network packet logging.
# When enabled, every incoming and outgoing packet is written to logs/network.log with
# a timestamp, direction (RECV/SEND), IPID, HDID, and the raw packet content.
# Useful for incident review and crash analysis. Generates significant log volume.
# Default: false
enable_network_logging = false

[MasterServer]

# Whether or not to advertise your server on the master server, which will make it discoverable by players.
# If you want to keep your server private, set this as false.
advertise = false

# The address of the master server. You shouldn't change this unless you know what you're doing.
addr = "https://servers.aceattorneyonline.com/servers"

[Discord]

# Discord bot token. Leave blank to disable the Discord bot.
# Create a bot at https://discord.com/developers/applications and copy the token here.
bot_token = ""

# The ID of the Discord server (guild) where the bot should register slash commands.
# Right-click your server name in Discord and select "Copy Server ID" (requires Developer Mode).
guild_id = ""

# The ID of the Discord role that is allowed to use moderation commands.
# Right-click the role in Server Settings > Roles and select "Copy Role ID".
# Leave blank to allow all users to run commands (not recommended).
mod_role_id = ""

[Voice]

# Opt-in server-relayed voice chat.  When enabled, clients that support
# voice (e.g. a patched webAO) stream Opus audio frames over their existing
# AO2 WebSocket connection; the server forwards each frame to every other
# joined peer in the same area.
#
# Privacy: every frame travels client → Athena → other clients.  Peers
# never connect to each other directly, so they cannot learn each other's
# IPs (which is what TURN was used for in the previous WebRTC mode).
# Athena itself sees every peer's IP, exactly as it does for chat packets.
#
# Disabled by default.  Set to true to allow voice clients to connect.
enable_voice = false

# Force push-to-talk on the client.  When true, clients are instructed to
# transmit audio only while the user holds the PTT key.  When false, clients
# may enable open-mic mode.
ptt_only = true

# Maximum number of simultaneous voice peers allowed in a single area.
# Server-relay scales O(n) per sender (one fan-out per joined peer); the
# hard limit is mostly about bandwidth and audibility, not CPU.
max_peers_per_area = 6

# Maximum size in bytes of a single VS_FRAME payload (the base64-encoded
# Opus packet).  4000 bytes comfortably fits a 20 ms Opus frame at any
# bitrate up to the codec's 510 kbps ceiling.  Oversized frames are dropped
# silently — a misbehaving client will simply not be heard.
max_frame_bytes = 4000

# Default voice-allowed setting for areas that don't set `voice_allowed`
# explicitly in areas.toml.  When true (default), every area permits voice
# once enable_voice is on; set to false to make voice opt-in per area.
# Moderators can hot-toggle any area at runtime with /voicearea on|off.
default_area_voice_allowed = true

# Per-UID rate limit on VS_JOIN packets.  Blunts join/leave spam.  Set
# join_rate_limit = 0 to disable.
join_rate_limit = 3
join_rate_limit_window = 10

# Per-UID rate limit on VS_FRAME packets (relayed audio frames).  At 20 ms
# frames the nominal rate is 50/sec; the default 60-per-1-second cap leaves
# ~20% jitter headroom while catching flooders.  Set frame_rate_limit = 0
# to disable, but be aware the relay then has no per-client throughput cap.
frame_rate_limit = 60
frame_rate_limit_window = 1

# Grace period, in seconds, before a newly-seen IPID may join voice chat.
# Mirrors new_ipid_ooc_cooldown but scoped to voice.  Blunts drive-by
# voice trolls on freshly-assigned IPs.  Set to 0 to disable.
new_ipid_voice_cooldown = 30
